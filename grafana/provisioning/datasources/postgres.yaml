apiVersion: 1
datasources:
  - name: Chess PostgreSQL
    uid: chess-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: chess
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
