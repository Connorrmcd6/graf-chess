apiVersion: 1
providers:
  - name: Chess Club
    orgId: 1
    folder: Chess Club
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
  - name: Chess Club archive
    orgId: 1
    folder: Archive
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/archive
