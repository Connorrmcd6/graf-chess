<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/app.css">
<title>Openings - Chess</title>
</head>
<body>
<main class="page"><div id="content" class="stack"></div></main>
<script src="/static/app.js"></script>
<script>
// Views live in the hash so the browser back button works: "" (openings), "#o/<opening>", "#l/<line>" (practise), "#learn/<line>".
let exploring = null;
let book = null, stats = { positions: {}, lines: {}, openings: {} }, practising = null, bookMoves = {};
const LEARNED = 3;  // clean runs in a row
const DAY = 864e5;
let progress = {};
try { progress = JSON.parse(store("openingProgress") || "{}"); } catch { progress = {}; }

async function load() {
  try {
    if (!book) {
      book = (await api.get("/api/openings")).openings;
      for (const o of book) for (const l of o.lines) for (const p of l.plies) if (p.key) (bookMoves[p.key] ||= new Set()).add(p.san);
    }
  } catch (e) { return fail(e); }
  try { stats = await api.get("/api/opening-stats?" + query()); } catch (e) { fail(e); }
  const lines = book.reduce((n, o) => n + o.lines.length, 0);
  document.getElementById("sub").textContent = `${book.length} openings · ${lines} lines`;
  // Mid-line, new stats only refresh the panel; re-rendering would restart the line.
  if (practising && location.hash === practising.hash) return practising.refresh();
  render();
}

function find(lineId) {
  for (const o of book) for (const l of o.lines) if (l.id === lineId) return [o, l];
  return [];
}
function prog(id) { return progress[id] || { streak: 0, runs: 0 }; }
function learned(id) { return prog(id).streak >= LEARNED; }
// Learned lines come back for review after 2, 4, 8... days, doubling with each clean run.
function reviewDays(streak) { return Math.min(60, 2 ** (streak - LEARNED + 1)); }
function status(id) {
  const p = prog(id);
  if (!p.runs) return p.seen ? "learning" : "new";
  if (p.streak < LEARNED) return "learning";
  return Date.now() - (p.last || 0) > reviewDays(p.streak) * DAY ? "due" : "learned";
}
const today = () => new Date().toLocaleDateString("en-CA");
function logRun() {
  let log = {};
  try { log = JSON.parse(store("practiceLog") || "{}"); } catch { log = {}; }
  log[today()] = (log[today()] || 0) + 1;
  store("practiceLog", JSON.stringify(log));
}
// Days in a row with at least one finished line, counting today or, if not yet, yesterday.
function streak() {
  let log = {};
  try { log = JSON.parse(store("practiceLog") || "{}"); } catch { return { days: 0, today: 0 }; }
  const day = new Date();
  if (!log[today()]) day.setDate(day.getDate() - 1);
  let days = 0;
  while (log[day.toLocaleDateString("en-CA")]) { days++; day.setDate(day.getDate() - 1); }
  return { days, today: log[today()] || 0 };
}
function save(id, change) { progress[id] = { ...prog(id), ...change }; store("openingProgress", JSON.stringify(progress)); }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function lineHref(line) { return (status(line.id) === "new" ? "#learn/" : "#l/") + line.id; }

// What to practise next: lines due for review, then ones you're learning, then new ones, then the longest unpractised.
function pickNext(lines, skip) {
  const rank = { due: 0, learning: 1, new: 2, learned: 3 };
  const pool = lines.filter((l) => l.id !== skip);
  return [...(pool.length ? pool : lines)].sort((a, b) => rank[status(a.id)] - rank[status(b.id)]
    || (status(a.id) === "learning" ? prog(b.id).streak - prog(a.id).streak : 0)
    || (status(a.id) === "new" ? 0 : (prog(a.id).last || 0) - (prog(b.id).last || 0)))[0];
}
function allLines() { return book.filter((o) => !o.fun).flatMap((o) => o.lines); }

function render() {
  if (!book) return;
  const content = document.getElementById("content");
  const [kind, id, path] = location.hash.slice(1).split("/");
  if (kind === "map" && exploring?.colour === id) return exploring.update(path ? path.split("_") : []);
  exploring = null;
  practising?.stop();
  practising = null;
  document.body.classList.remove("focus");
  window.scrollTo(0, 0);
  if ((kind === "l" || kind === "learn") && find(id).length) {
    const [o, line] = find(id);
    return practise([{ o, line }], kind === "learn" ? "learn" : "practise");
  }
  if (kind === "h" && hiddenPool(id).length) return practise(hiddenPool(id), "hidden", id, hiddenStart(id));
  if (kind === "map" && (id === "white" || id === "black")) return explorer(id, path ? path.split("_") : []);
  const opening = (kind === "o" || kind === "t") && book.find((o) => o.id === id);
  content.replaceChildren(...(opening ? linesView(opening, kind === "t") : openingsView()).filter((c) => c != null));
}

function colourTag(o) { return h("span", { class: "tag" }, o.colour === "white" ? "as White" : "as Black"); }
function thumb(fen, colour, cls = "thumb") { return h("img", { class: cls, src: boardUrl(fen, colour), alt: "", loading: "lazy" }); }
function meter(done, total) {
  return h("div", { class: "meter", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(done) },
    h("i", { style: `width:${total ? (done / total) * 100 : 0}%` }));
}
function counts(lines) {
  const c = { new: 0, learning: 0, learned: 0, due: 0 };
  for (const l of lines) c[status(l.id)]++;
  return c;
}
const STATUS_TAG = { new: ["new", "New"], learning: ["warn", null], learned: ["good", "✓ Learned"], due: ["accent", "Review"] };
function statusTag(id) {
  const st = status(id), [cls, text] = STATUS_TAG[st];
  return h("span", { class: "tag " + cls }, text || `${prog(id).streak}/${LEARNED}`);
}

function slipNote(slip) {
  return slip && h("div", { class: "slip small" },
    `You played ${slip.label.replace(slip.book, slip.san)} instead of ${slip.label} in ${slip.times} game${slip.times > 1 ? "s" : ""}`);
}

function openingRow(o) {
  const games = stats.openings[o.id]?.games || 0;
  const c = counts(o.lines);
  return h("a", { class: "list-row opening-row", href: "#o/" + o.id },
    thumb(o.preview, o.colour),
    h("div", { class: "grow" },
      h("div", { class: "row" }, h("b", { class: "grow ellipsis" }, o.name), c.due ? h("span", { class: "tag accent" }, `${c.due} to review`) : ""),
      h("div", { class: "small muted" }, [`${c.learned + c.due}/${o.lines.length} learned`, games && `${games} of your games`].filter(Boolean).join(" · ")),
      meter(c.learned + c.due, o.lines.length),
      slipNote(stats.openings[o.id]?.slip)),
    h("span", { class: "muted chev", "aria-hidden": "true" }, "›"));
}

function nextCard(lines, title, hero = false) {
  const next = pickNext(lines);
  const [o] = find(next.id);
  const c = counts(lines);
  const why = { due: "Due for review", learning: "Keep it going", new: "Something new", learned: "Keep it fresh" }[status(next.id)];
  const st = streak();
  const streakNote = hero && h("div", { class: "streak" }, st.days
    ? `🔥 ${st.days}-day streak` + (st.today ? ` · ${st.today} line${st.today > 1 ? "s" : ""} today` : " · practise to keep it")
    : "Finish a line to start a streak");
  return h("div", { class: "card next" + (hero ? " hero" : "") },
    h("div", { class: "row" },
      h("div", { class: "grow" }, h("h2", {}, title),
        h("div", { class: "small muted" }, `${c.learned + c.due} of ${lines.length} lines learned` + (c.due ? ` · ${c.due} to review` : "")),
        streakNote),
      h("div", { class: "ring", style: `--p:${((c.learned + c.due) / lines.length) * 100}` }, h("span", {}, `${Math.round(((c.learned + c.due) / lines.length) * 100)}%`))),
    h("a", { class: "btn primary block next-btn", href: lineHref(next) },
      h("span", { class: "grow ellipsis", style: "text-align:left" }, h("span", { class: "why" }, why), next.name, h("span", { class: "of" }, " · " + o.name)),
      h("span", { "aria-hidden": "true" }, "▶")));
}

function hiddenButton(href, label, sub) {
  return h("a", { class: "btn block hidden-btn", href },
    h("span", { class: "q", "aria-hidden": "true" }, "?"),
    h("span", { class: "grow", style: "text-align:left;min-width:0" }, h("b", {}, label), h("span", { class: "sub ellipsis" }, sub)));
}

function openingsView() {
  const group = (title, list) => list.length ? section(title, h("div", { class: "list" }, list.map(openingRow))) : [];
  return [
    nextCard(allLines(), "Today's practice", true),
    h("div", { class: "hidden-pair" },
      hiddenButton("#h/white", "As White", "Surprise line"),
      hiddenButton("#h/black", "As Black", "Surprise line")),
    h("div", { class: "list" }, h("a", { class: "list-row drill-link", href: "/drill" },
      h("span", { class: "icon", html: ICONS.drill }),
      h("div", { class: "grow" }, h("b", {}, "Drill your mistakes"),
        h("div", { class: "small muted" }, "Find the move you missed in your own games")),
      h("span", { class: "muted chev", "aria-hidden": "true" }, "›"))),
    mapCard(),
    ...group("As White", book.filter((o) => !o.fun && o.colour === "white")),
    ...group("As Black", book.filter((o) => !o.fun && o.colour === "black")),
    ...group("Just for fun", book.filter((o) => o.fun)),
    h("p", { class: "small muted" },
      "New lines start in Learn mode, which shows each move. In Practise you play from memory. ",
      "Hidden mode doesn't say which line is coming, so you have to answer whatever your opponent plays. ",
      `A line is learned after ${LEARNED} clean runs in a row, then comes back for review after a few days.`),
  ];
}

function linesView(o, tree) {
  return [
    h("div", { class: "row" }, h("a", { class: "btn slim", href: "#", "aria-label": "Back to openings" }, "‹"),
      h("h2", { class: "grow ellipsis" }, o.name), colourTag(o)),
    slipNote(stats.openings[o.id]?.slip),
    nextCard(o.lines, "Up next"),
    hiddenButton("#h/" + o.id, "Hidden line", o.colour === "black" ? "White picks the line, you answer" : "Black picks the line, you answer"),
    h("div", { class: "seg", role: "group", "aria-label": "View" },
      h("button", { "aria-pressed": String(!tree), onclick: () => go("#o/" + o.id) }, "Lines"),
      h("button", { "aria-pressed": String(tree), onclick: () => go("#t/" + o.id) }, "Tree")),
    tree ? treeView(o) : h("div", { class: "list" }, o.lines.map((l) => {
      const s = stats.lines[l.id] || {};
      return h("a", { class: "list-row", href: lineHref(l) },
        thumb(l.end_fen, o.colour),
        h("div", { class: "grow", style: "min-width:0" },
          h("div", { class: "row" }, h("b", { class: "grow" }, l.name), statusTag(l.id)),
          h("div", { class: "line clamp" }, l.moves),
          h("div", { class: "small muted" }, [
            l.freq != null && `${l.freq < 0.1 ? "<0.1" : l.freq}% of 1400-1800 games`,
            s.games ? `${s.games} of your games` : "Not in your analysed games yet",
            s.deepest && `you got as far as ${s.deepest}`].filter(Boolean).join(" · ")),
          slipNote(s.slip)));
    })),
  ];
}

// The opening's lines merged into one tree: a node per move, split where the lines go different ways.
function buildTree(o) {
  const root = { kids: [], lines: o.lines, depth: 0 };
  for (const line of o.lines) {
    let node = root;
    line.plies.forEach((ply, k) => {
      let next = node.kids.find((c) => c.ply.uci === ply.uci);
      if (!next) node.kids.push(next = { ply, kids: [], lines: [], depth: k + 1, via: line });
      next.lines.push(line);
      node = next;
    });
    node.end = line;
  }
  return root;
}

function movesText(plies, colour) {
  return plies.map((p, k) => h("span", { class: p.mover === colour ? "you" : "them" }, p.mover === "white" || k === 0 ? p.label : p.san));
}

function treeView(o) {
  const root = buildTree(o);
  function branch(node) {
    const chain = [node];
    let last = node;
    while (last.kids.length === 1 && !last.end) chain.push(last = last.kids[0]);
    const forks = last.kids.length > 1;
    return h("div", { class: "tnode" },
      h("button", { class: "tchain", onclick: () => branchSheet(o, last) }, ...movesText(chain.map((n) => n.ply), o.colour),
        forks && h("span", { class: "tcount" }, `${last.lines.length} lines`)),
      last.end && h("a", { class: "tleaf", href: lineHref(last.end) }, h("span", { class: "grow" }, last.end.name), statusTag(last.end.id)),
      last.kids.length ? h("div", { class: "tkids" + (forks ? " fork" : "") }, last.kids.map(branch)) : "");
  }
  return h("div", { class: "card tree" },
    h("div", { class: "small muted" }, h("span", { class: "them" }, "Opponent"), " picks at each split; ",
      h("span", { class: "you" }, "your moves"), " are the same in every line. Tap moves to see the position."),
    root.kids.map(branch));
}

// Every opening for a colour merged into one tree of moves.
function repTree(colour) {
  const root = { kids: [], items: [], depth: 0 };
  for (const o of book.filter((x) => !x.fun && x.colour === colour)) {
    for (const line of o.lines) {
      let node = root;
      root.items.push({ o, line });
      line.plies.forEach((ply, k) => {
        let next = node.kids.find((c) => c.ply.uci === ply.uci);
        if (!next) node.kids.push(next = { ply, kids: [], items: [], depth: k + 1 });
        next.items.push({ o, line });
        node = next;
      });
    }
  }
  return root;
}
function repNode(colour, path) {
  const nodes = [repTree(colour)];
  for (const uci of path) {
    const next = nodes[nodes.length - 1].kids.find((c) => c.ply.uci === uci);
    if (!next) break;
    nodes.push(next);
  }
  return nodes;
}
const openingsOf = (n) => [...new Set(n.items.map((i) => i.o))];
const progressTag = (o) => {
  const c = counts(o.lines);
  return h("span", { class: "tag" + (c.learned + c.due === o.lines.length ? " good" : "") }, `${c.learned + c.due}/${o.lines.length}`);
};

// The text version: cut off where the moves so far only fit one opening.
function mapView(colour) {
  const root = repTree(colour);
  const label = (n) => (n.kids[0]?.ply.mover === colour ? "You choose" : "If they play");
  function branch(node) {
    const chain = [node];
    let last = node;
    while (openingsOf(last).length > 1 && last.kids.length === 1) chain.push(last = last.kids[0]);
    const moves = h("span", { class: "mmoves" }, ...movesText(chain.map((n) => n.ply), colour));
    const os = openingsOf(last);
    if (os.length === 1) {
      const o = os[0];
      const then = last.ply.mover !== colour && last.items[0].line.plies.slice(last.depth).find((p) => p.mover === colour);
      return h("a", { class: "mrow leaf", href: "#o/" + o.id }, moves, h("span", { class: "marrow", "aria-hidden": "true" }, "→"),
        h("span", { class: "grow mname" }, h("b", {}, o.name), then ? h("span", { class: "small muted" }, ` · play ${then.label}`) : ""),
        progressTag(o));
    }
    return h("div", { class: "mnode" }, h("div", { class: "mrow" }, moves),
      h("div", { class: "mkids" }, h("div", { class: "mlabel" }, label(last)), last.kids.map(branch)));
  }
  return h("div", { class: "map" }, h("div", { class: "mkids top" }, h("div", { class: "mlabel" }, label(root)), root.kids.map(branch)));
}

function mapCard() {
  return h("div", { class: "card explore-card" },
    h("div", {}, h("h2", {}, "Repertoire explorer"),
      h("div", { class: "small muted" }, "Step through your openings on a board and see where each move leads.")),
    h("div", { class: "row" },
      h("a", { class: "btn grow", href: "#map/white" }, "♔ As White"),
      h("a", { class: "btn grow", href: "#map/black" }, "♚ As Black")));
}

// A board you walk through your repertoire on: arrows for every move you have prepared, rows saying where each leads.
function explorer(colour, path) {
  const content = document.getElementById("content");
  const href = (list) => `#map/${colour}` + (list.length ? "/" + list.join("_") : "");
  let ucis = [];
  const board = tapBoard({ colour, onMove: (uci) => go(href([...ucis, uci])) });
  const crumbs = h("div", { class: "strip", "aria-label": "Moves" });
  const status = h("div", { class: "feedback" });
  const note = h("div", { class: "note small hidden" });
  const options = h("div", { class: "list" });
  const optionsTitle = h("h3", { class: "section" });
  const backBtn = h("button", { class: "btn", onclick: () => go(href(ucis.slice(0, -1))) }, "‹ Back");
  const practiseBtn = h("a", { class: "btn primary grow" }, "Practise from here");

  function update(list) {
    const nodes = repNode(colour, list), node = nodes[nodes.length - 1];
    ucis = nodes.slice(1).map((n) => n.ply.uci);
    const line = node.items[0].line;
    const fen = node.depth < line.plies.length ? line.plies[node.depth].fen : line.end_fen;
    board.set({ fen, legal: Object.fromEntries(node.kids.map((k) => [k.ply.uci, k.ply.san])), last: node.ply?.uci || "",
      check: /[+#]/.test(node.ply?.san || ""), arrows: node.kids.map((k) => [k.ply.uci, k.ply.mover === colour ? "green" : "grey"]) });

    crumbs.replaceChildren(h("button", { class: "m" + (ucis.length ? "" : " cur"), onclick: () => go(href([])) }, "Start"),
      ...nodes.slice(1).flatMap((n, k) => [
        n.ply.mover === "white" || k === 0 ? h("span", { class: "n" }, n.ply.label.match(/^\d+\.*…?/)[0]) : "",
        h("button", { class: "m" + (k === ucis.length - 1 ? " cur" : "") + (n.ply.mover === colour ? " you" : ""),
          onclick: () => go(href(ucis.slice(0, k + 1))) }, n.ply.san)]));
    crumbs.scrollLeft = crumbs.scrollWidth;

    const os = openingsOf(node);
    if (!ucis.length) status.replaceChildren(h("span", {}, "Tap a move on the board or below. ", h("span", { class: "muted" }, "Green arrows are your moves, grey ones your opponent's.")));
    else if (os.length === 1) status.replaceChildren(h("span", { class: "grow" }, "You're in the ", h("b", {}, os[0].name)),
      h("a", { class: "btn slim", href: "#o/" + os[0].id }, "Open"));
    else status.replaceChildren(h("span", {}, h("b", {}, `${os.length} openings`), " still possible from here"));
    status.className = "feedback" + (ucis.length && os.length === 1 ? " good" : "");
    note.classList.toggle("hidden", !node.ply?.note);
    if (node.ply?.note) note.replaceChildren(h("b", {}, node.ply.label + " "), node.ply.note,
      node.ply.check ? h("span", { class: "tag warn" }, "worth checking") : "");

    const mine = node.kids[0]?.ply.mover === colour;
    optionsTitle.textContent = !node.kids.length ? "End of your preparation" : mine ? "Your move" : "If they play";
    options.replaceChildren(...node.kids.map((k) => {
      const to = openingsOf(k);
      return h("a", { class: "list-row option", href: href([...ucis, k.ply.uci]) },
        h("span", { class: "omove " + (mine ? "you" : "them") }, k.ply.label),
        h("span", { class: "grow", style: "min-width:0" },
          h("span", { class: "row" }, h("span", { class: "grow ellipsis" }, to.length === 1 ? to[0].name : `${to.length} openings`),
            h("span", { class: "small muted" }, `${k.items.length} line${k.items.length > 1 ? "s" : ""}`),
            to.length === 1 ? progressTag(to[0]) : ""),
          k.ply.note && h("span", { class: "onote" }, k.ply.note, k.ply.check ? h("span", { class: "tag warn" }, "worth checking") : "")));
    }));
    options.classList.toggle("hidden", !node.kids.length);
    backBtn.disabled = !ucis.length;
    practiseBtn.href = "#h/map-" + colour + (ucis.length ? "-" + ucis.join("_") : "");
    practiseBtn.textContent = `Practise from here · ${node.items.length}`;
    practiseBtn.title = `${node.items.length} lines, hidden`;
  }

  exploring = { colour, update };
  document.body.classList.add("focus");
  content.replaceChildren(
    h("div", { class: "row" }, h("a", { class: "btn slim", href: "#", "aria-label": "Back to openings" }, "‹"),
      h("h2", { class: "grow" }, "Explorer"),
      h("div", { class: "seg mode", role: "group", "aria-label": "Colour" },
        h("button", { "aria-pressed": String(colour === "white"), onclick: () => go("#map/white") }, "White"),
        h("button", { "aria-pressed": String(colour === "black"), onclick: () => go("#map/black") }, "Black"))),
    board.el, crumbs, status, note,
    h("div", { class: "row" }, backBtn, practiseBtn),
    optionsTitle, options,
    h("details", { class: "card fullmap" }, h("summary", {}, "Full map"), mapView(colour)));
  update(path);
}

function branchSheet(o, node) {
  const line = node.via, after = node.depth < line.plies.length ? line.plies[node.depth].fen : line.end_fen;
  const key = `${o.id}~${line.id}~${node.depth}`;
  sheet(h("div", { class: "title" }, o.name),
    h("div", { class: "line" }, ...movesText(line.plies.slice(0, node.depth), o.colour)),
    h("img", { class: "big-board", style: "margin-top:12px", src: boardUrl(after, o.colour, "", node.ply.uci), alt: "Board position" }),
    h("button", { class: "btn primary block", style: "margin-top:14px", onclick: () => { closeSheet(); go(node.lines.length > 1 ? "#h/" + key : lineHref(line)); } },
      node.lines.length > 1 ? `Practise this branch (${node.lines.length} lines, hidden)` : "Practise this line"),
    h("div", { class: "menu" }, node.lines.map((l) => h("button", { onclick: () => { closeSheet(); go(lineHref(l)); } },
      h("span", { class: "grow" }, l.name), statusTag(l.id)))));
}

const TOOL_ICONS = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  hint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
};
const buzz = (pattern) => navigator.vibrate?.(pattern);

// The lines a hidden run can play: one opening, or every opening for a colour.
function hiddenPool(key) {
  if (key.startsWith("map-")) {
    const [, colour, path] = key.split("-");
    const nodes = repNode(colour, path ? path.split("_") : []);
    return nodes[nodes.length - 1].items;
  }
  if (key.includes("~")) {
    const [, lineId, depth] = key.split("~"), [o, line] = find(lineId);
    if (!o) return [];
    const prefix = line.plies.slice(0, Number(depth)).map((p) => p.uci).join();
    return o.lines.filter((l) => l.plies.slice(0, Number(depth)).map((p) => p.uci).join() === prefix).map((l) => ({ o, line: l }));
  }
  const openings = key === "white" || key === "black" ? book.filter((o) => !o.fun && o.colour === key) : book.filter((o) => o.id === key);
  return openings.flatMap((o) => o.lines.map((line) => ({ o, line })));
}
// Runs from the explorer or a tree branch start at that position; the moves before it are already played.
function hiddenStart(key) {
  if (key.startsWith("map-")) return (key.split("-")[2] || "").split("_").filter(Boolean).length;
  return key.includes("~") ? Number(key.split("~")[2]) : 0;
}
function hiddenLabel(key) {
  if (key.startsWith("map-")) {
    const [, colour, path] = key.split("-");
    const plies = repNode(colour, path ? path.split("_") : []).slice(1).map((n) => n.ply);
    return `${colour === "white" ? "White" : "Black"} repertoire` + (plies.length ? " · after " + plies.map((p, k) => p.mover === "white" || k === 0 ? p.label : p.san).join(" ") : "");
  }
  if (key.includes("~")) return find(key.split("~")[1])[0]?.name + " · branch";
  return key === "white" ? "All White openings" : key === "black" ? "All Black openings" : book.find((o) => o.id === key)?.name;
}
let lastHidden = null;

// Learn shows each of your moves as an arrow. Practise is from memory: a wrong move is played, then taken back,
// and a second miss on the same move shows the hint. Back steps to your previous move.
// Hidden doesn't say which line: at each opponent move it picks among the lines that fit the moves so far
// (favouring ones due or being learned), and any repertoire move that fits is accepted.
function practise(pool, mode, hiddenKey, start = 0) {
  const learning = mode === "learn", hidden = mode === "hidden";
  const content = document.getElementById("content");
  let o, line, plies;
  const use = (entry) => { ({ o, line } = entry); plies = line.plies; };
  const weight = (e) => ({ due: 3, learning: 2, new: 1, learned: 1 })[status(e.line.id)] * (e.line.id === lastHidden ? 0.25 : 1);
  function pick(entries) {
    let r = Math.random() * entries.reduce((n, e) => n + weight(e), 0);
    return entries.find((e) => (r -= weight(e)) < 0) || entries[entries.length - 1];
  }
  const fits = (e) => e.line.plies.length > i && plies.slice(0, i).every((p, k) => e.line.plies[k].uci === p.uci);
  let i = 0, wrong = null, timer = null, recorded = false, hinted = false;
  const from = () => Math.min(start, plies.length);
  use(hidden ? pick(pool) : pool[0]);
  const colour = o.colour;
  const fenAt = (k) => (k < plies.length ? plies[k].fen : line.end_fen);
  const mine = (k) => k < plies.length && plies[k].mover === colour;
  i = from();
  const missed = new Set();  // your plies with a wrong move or a hint, counted once each
  const tries = {};
  const board = tapBoard({ colour, onMove });
  const strip = h("div", { class: "strip", "aria-label": "Moves" });
  const feedback = h("div", { class: "feedback", role: "status", "aria-live": "polite" });
  const noteEl = h("div", { class: "note hidden" });
  const statsEl = h("div");
  const extra = h("div", { class: "extra small" }, noteEl, statsEl);
  // Notes say why a move is played. From memory you only see them for moves already on the board.
  function showNote(ks) {
    const shown = ks.filter((k) => k >= 0 && plies[k]?.note);
    noteEl.classList.toggle("hidden", !shown.length);
    noteEl.replaceChildren(...shown.map((k) => h("div", {}, h("b", {}, plies[k].label + " "), plies[k].note,
      plies[k].check ? h("span", { class: "tag warn" }, "worth checking") : "")));
  }
  const bar = h("i");
  const title = h("b", {}, hidden ? "Hidden line" : line.name);
  const tool = (icon, label, onclick, key) => h("button", { class: "tool", onclick, title: `${label} (${key})`, html: TOOL_ICONS[icon] + `<span>${label}</span>` });
  const backBtn = tool("back", "Back", back, "←"), hintBtn = tool("hint", "Hint", hint, "H");
  const modes = hidden ? h("span", { class: "tag accent" }, "Hidden")
    : h("div", { class: "seg mode", role: "group", "aria-label": "Mode" },
      h("button", { "aria-pressed": String(learning), onclick: () => go("#learn/" + line.id) }, "Learn"),
      h("button", { "aria-pressed": String(!learning), onclick: () => go("#l/" + line.id) }, "Practise"));
  const again = () => go(hidden ? "#h/" + hiddenKey : (learning ? "#learn/" : "#l/") + line.id);

  const last = () => (i > 0 ? plies[i - 1].uci : "");
  const check = () => i > 0 && /[+#]/.test(plies[i - 1].san);
  function say(text, kind = "") { feedback.className = "feedback " + kind; feedback.replaceChildren(h("span", {}, ...[text].flat())); }
  const num = (p) => p.label.match(/^\d+/)[0];

  function drawStrip() {
    const cells = [];
    plies.slice(0, i).forEach((p, k) => {
      if (p.mover === "white") cells.push(h("span", { class: "n" }, num(p) + "."));
      else if (k === 0) cells.push(h("span", { class: "n" }, num(p) + "…"));
      cells.push(h("span", { class: "m" + (missed.has(k) ? " missed" : "") }, p.san));
    });
    if (wrong) {
      const p = plies[i];
      if (p.mover === "white") cells.push(h("span", { class: "n" }, num(p) + "."));
      cells.push(h("span", { class: "m bad" }, p.legal[wrong] + " ✕"));
    }
    if (!cells.length) cells.push(h("span", { class: "n" }, "Starting position"));
    [...cells].reverse().find((c) => c.classList.contains("m"))?.classList.add("cur");
    strip.replaceChildren(...cells);
    strip.scrollLeft = strip.scrollWidth;
    const myPlies = plies.map((_, k) => k).filter(mine);
    bar.style.width = hidden ? "0" : `${(myPlies.filter((k) => k < i).length / myPlies.length) * 100}%`;
  }

  function tools() {
    let prev = i - 1;
    while (prev >= from() && !mine(prev)) prev--;
    backBtn.disabled = !wrong && prev < from();
    hintBtn.disabled = learning || !!wrong || !mine(i) || hinted;
  }

  function step() {
    clearTimeout(timer);
    wrong = null;
    hinted = false;
    if (hidden && i < plies.length && !mine(i)) use(pick(pool.filter(fits)));
    drawStrip();
    extra.replaceChildren(noteEl, statsEl);
    statsEl.replaceChildren();
    if (i >= plies.length) return finish();
    tools();
    const ply = plies[i];
    if (!mine(i)) {
      say(h("span", { class: "muted" }, "Opponent is thinking…"));
      showNote([i - 1]);
      board.set({ fen: fenAt(i), last: last(), check: check(), locked: true });
      timer = setTimeout(() => { i++; step(); }, i === 0 ? 600 : 500);
      return;
    }
    showNote(learning ? [i - 1, i] : [plies[i - 1]?.note ? i - 1 : i - 2]);
    if (learning) {
      say(["Play ", h("b", {}, ply.label)], "hint");
      board.set({ fen: fenAt(i), legal: ply.legal, last: last(), check: check(), best: ply.uci });
    } else {
      say(tries[i] ? ["Try again: ", h("b", {}, ply.label.replace(ply.san, "?"))] : ["Your move: ", h("b", {}, ply.label.replace(ply.san, "?"))]);
      board.set({ fen: fenAt(i), legal: ply.legal, last: last(), check: check() });
      if (tries[i] >= 2) hint();
    }
    showStats(ply);
  }

  function showStats(ply) {
    const s = ply.key && stats.positions[ply.key];
    if (!s) return statsEl.replaceChildren(h("span", { class: "muted" }, "You haven't reached this position in your analysed games."));
    if (!learning && !hinted) {
      // From memory, so don't give the answer away: only say how often you've been here.
      return statsEl.replaceChildren(h("span", { class: "muted" }, `You've reached this position in ${s.games} game${s.games > 1 ? "s" : ""}.`));
    }
    const colourOf = (san) => san === ply.san ? "var(--good)" : bookMoves[ply.key]?.has(san) ? "var(--text)" : "var(--bad)";
    statsEl.replaceChildren(h("span", { class: "muted" }, `In your games here (${s.games}): `),
      ...s.moves.flatMap((m, k) => [k ? " · " : "", h("b", { style: "color:" + colourOf(m.san) }, m.san),
        ` ${m.games}×`, m.san !== ply.san && m.avg_loss ? ` (−${Math.round(m.avg_loss)} pts)` : ""]));
  }

  function onMove(move) {
    const ply = plies[i];
    if (move === ply.uci) { i++; return step(); }
    const others = hidden ? pool.filter((e) => fits(e) && e.line.plies[i].uci === move) : [];
    if (others.length) { use(pick(others)); i++; return step(); }
    if (!learning) missed.add(i);
    tries[i] = (tries[i] || 0) + 1;
    wrong = move;
    buzz(60);
    board.set({ fen: fenAt(i), play: move, locked: true });
    say(["✕ ", h("b", {}, ply.legal[move]), learning ? " isn't it. Follow the arrow." : hidden ? (hiddenKey === colour || hiddenKey.startsWith("map-") ? " isn't in your repertoire." : " isn't in this opening.") : " isn't the line."], "bad");
    drawStrip();
    tools();
    timer = setTimeout(step, 900);
  }

  function back() {
    if (wrong) return step();
    let prev = i - 1;
    while (prev >= from() && !mine(prev)) prev--;
    if (prev < from()) return;
    i = prev;
    step();
  }

  function hint() {
    if (wrong || !mine(i) || learning) return;
    const ply = plies[i];
    missed.add(i);
    hinted = true;
    board.set({ fen: fenAt(i), legal: ply.legal, last: last(), check: check(), best: ply.uci });
    say(["Hint: play ", h("b", {}, ply.label)], "hint");
    showNote([i]);
    drawStrip();
    tools();
    showStats(ply);
  }

  function dots(streak) {
    return h("div", { class: "dots", "aria-label": `${Math.min(streak, LEARNED)} of ${LEARNED} clean runs` },
      [...Array(LEARNED)].map((_, k) => h("i", { class: k < streak ? "on" : "" })));
  }

  function finish() {
    const before = prog(line.id);
    if (!recorded) {
      recorded = true;
      if (learning) save(line.id, { seen: true });
      else {
        const streak = missed.size ? (before.streak >= LEARNED ? LEARNED - 1 : 0) : before.streak + 1;
        save(line.id, { runs: before.runs + 1, streak, last: Date.now(), seen: true });
      }
      if (hidden) lastHidden = line.id;
      logRun();
      buzz(missed.size ? 0 : [15, 60, 15]);
    }
    const p = prog(line.id);
    board.set({ fen: line.end_fen, last: last(), check: check(), locked: true });
    tools();
    if (hidden) title.textContent = line.name;
    let text, kind;
    if (learning) [text, kind] = ["Line complete. Now try it from memory.", "good"];
    else if (missed.size) [text, kind] = [`Line complete with ${missed.size} mistake${missed.size > 1 ? "s" : ""}. Streak reset.`, "bad"];
    else if (p.streak === LEARNED) [text, kind] = ["✓ Clean run. Line learned!", "good"];
    else if (p.streak > LEARNED) [text, kind] = [`✓ Clean run. Next review in ${reviewDays(p.streak)} days.`, "good"];
    else [text, kind] = [`✓ Clean run, ${LEARNED - p.streak} more to learn it.`, "good"];
    say(hidden ? [text, h("div", { class: "reveal" }, "It was ", h("b", {}, line.name), ` (${o.name})`)] : text, kind);
    const buttons = hidden
      ? [h("a", { class: "btn grow", href: "#l/" + line.id }, "This line"),
        h("a", { class: "btn primary grow", href: "#h/" + hiddenKey, id: "next", onclick: (e) => { e.preventDefault(); again(); } }, "Another ▶")]
      : [h("a", { class: "btn " + (learning ? "primary" : "") + " grow", href: "#l/" + line.id, onclick: (e) => { e.preventDefault(); go("#l/" + line.id); } }, learning ? "Practise it" : "Again"),
        h("a", { class: "btn " + (learning ? "" : "primary") + " grow", href: lineHref(pickNext(o.lines, line.id)), id: "next" }, "Next line ▶")];
    showNote([plies.length - 1]);
    extra.replaceChildren(noteEl, h("div", { class: "done" },
      !learning && dots(p.streak),
      h("div", { class: "row" }, ...buttons,
        h("a", { class: "btn slim", href: lichessUrl(line.end_fen, colour), target: "_blank", rel: "noopener", title: "Open in Lichess" }, "↗"))));
  }

  function keys(e) {
    if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === "arrowleft" || key === "backspace") back();
    else if (key === "h") hint();
    else if (key === "r") again();
    else if ((key === "enter" || key === "arrowright") && i >= plies.length) document.getElementById("next")?.click();
    else return;
    e.preventDefault();
  }
  document.addEventListener("keydown", keys);

  practising = {
    hash: location.hash,
    stop: () => { clearTimeout(timer); document.removeEventListener("keydown", keys); },
    refresh: () => { if (mine(i) && !wrong) showStats(plies[i]); },
  };
  document.body.classList.add("focus");
  const home = !hidden ? "#o/" + o.id : hiddenKey === "white" || hiddenKey === "black" ? "#"
    : hiddenKey.startsWith("map-") ? "#map/" + hiddenKey.split("-").slice(1, 3).filter(Boolean).join("/")
    : (hiddenKey.includes("~") ? "#t/" : "#o/") + o.id;
  content.replaceChildren(h("div", { class: "practice" },
    h("div", { class: "row" },
      h("a", { class: "btn slim", href: home, "aria-label": "Back" }, "‹"),
      h("div", { class: "grow", style: "min-width:0" },
        h("div", { class: "title" }, title),
        h("div", { class: "ellipsis muted small" }, `${hidden ? hiddenLabel(hiddenKey) : o.name} · ${colour === "white" ? "White" : "Black"}`)),
      modes),
    h("div", { class: "meter thin" }, bar),
    board.el, strip, feedback, extra,
    h("div", { class: "toolbar" }, backBtn, hintBtn, tool("restart", hidden ? "New" : "Restart", again, "R"))));
  step();
}

window.addEventListener("hashchange", render);
setup("Openings", load);
</script>
</body>
</html>
