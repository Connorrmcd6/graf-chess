<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/app.css">
<title>Drill - Chess</title>
</head>
<body>
<main class="page"><div id="content" class="stack"></div></main>
<script src="/static/app.js"></script>
<script>
let deck = [], index = 0;
let score = JSON.parse(store("drillScore") || '{"got":0,"missed":0}');

async function load() {
  let d;
  try { d = await api.get("/api/drill?" + query()); } catch (e) { return fail(e); }
  // Repeated positions first (already ordered by the server), the rest shuffled.
  const repeated = d.positions.filter((p) => p.repeated);
  const rest = d.positions.filter((p) => !p.repeated).sort(() => Math.random() - 0.5);
  deck = [...repeated, ...rest];
  index = 0;
  show();
}

function show() {
  const content = document.getElementById("content");
  document.getElementById("sub").textContent = deck.length ? `Position ${index + 1} of ${deck.length}` : "";
  if (!deck.length) return content.replaceChildren(empty("Nothing to drill", "Mistakes and blunders from analysed games appear here."));
  const p = deck[index];
  const legal = p.legal || {};
  const board = tapBoard({ colour: p.colour, onMove: (move) => finish(move) });
  board.set({ fen: p.fen, legal });
  const hint = h("div", { class: "muted small" }, "Tap a piece, then the square to move it to.");
  const result = h("div", { class: "stack hidden" });
  const giveUp = h("button", { class: "btn block", onclick: () => finish(null) }, "Show answer");
  const skip = h("button", { class: "btn block", onclick: next }, "Skip");

  function finish(move) {
    const correct = move === p.best_uci;
    score[correct ? "got" : "missed"]++;
    store("drillScore", JSON.stringify(score));
    board.set({ fen: p.fen, you: correct ? "" : move || "", best: p.best_uci, locked: true });
    giveUp.classList.add("hidden");
    skip.classList.add("hidden");
    hint.classList.add("hidden");
    const engine = h("b", {}, p.best_san);
    result.replaceChildren(
      h("div", { class: "verdict " + (correct ? "good" : "bad") },
        correct ? ["✓ Correct: ", engine] : move ? ["✕ ", legal[move], " isn't the engine's move. It wants ", engine, "."] : ["The engine wants ", engine, "."]),
      move && !correct && legend(),
      h("div", {}, move === p.uci ? "That's also what you played in the game." : ["In the game you played ", h("b", { style: "color:var(--bad)" }, p.san),
        `, costing ${Math.round(p.win_loss)} pts.`]),
      p.best_line && h("div", { class: "line" }, p.best_line),
      h("div", { class: "small muted" }, [p.kind && KIND[p.kind], p.opening].filter(Boolean).join(" · ")),
      h("button", { class: "btn primary block", onclick: next }, "Next position"),
      h("div", { class: "row" },
        h("a", { class: "btn grow", href: lichessUrl(p.fen, p.colour), target: "_blank", rel: "noopener" }, "Open in Lichess"),
        p.url && h("a", { class: "btn", href: p.url, target: "_blank", rel: "noopener" }, "Game")));
    result.classList.remove("hidden");
    document.querySelector(".score").textContent = `✓ ${score.got}  ✕ ${score.missed}`;
  }

  content.replaceChildren(
    h("div", { class: "row" },
      h("div", { class: "grow" }, h("b", {}, `${p.colour === "white" ? "White" : "Black"} to move`),
        h("div", { class: "small muted" }, p.repeated ? "You've gone wrong here more than once" : `Move ${p.move_number} · ${shortDate(p.ended_at)}`)),
      h("div", { class: "small muted score" }, `✓ ${score.got}  ✕ ${score.missed}`)),
    board.el,
    hint, result, giveUp, skip);
}

function next() {
  index = (index + 1) % deck.length;
  show();
  window.scrollTo(0, 0);
}

setup("Drill", load);
</script>
</body>
</html>
