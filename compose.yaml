services:
  db:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run uv run scripts/setup.py first}
      COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD:?Run uv run scripts/setup.py first}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Run uv run scripts/setup.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d chess"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  collector:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chess_owner:${COLLECTOR_PASSWORD}@db:5432/chess
      COMPETITION_CONFIG: /app/competition.json
      CHESS_USER_AGENT: ${CHESS_USER_AGENT:-graf-chess/0.1}
      POLL_SECONDS: "3600"
    volumes:
      - ./competition.json:/app/competition.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, chess-collector, health]
      interval: 60s
      timeout: 10s
      start_period: 10m
      retries: 3
    networks: [backend, outbound]

  analyser:
    build: .
    restart: unless-stopped
    entrypoint: [chess-analyse]
    command: [--loop]
    environment:
      DATABASE_URL: postgresql://chess_owner:${COLLECTOR_PASSWORD}@db:5432/chess
      ANALYSIS_THREADS: ${ANALYSIS_THREADS:-2}
      ANALYSIS_DEPTH: ${ANALYSIS_DEPTH:-14}
      ANALYSIS_DAYS: ${ANALYSIS_DAYS:-60}
      ANALYSIS_INTERVAL: "1800"
    stop_grace_period: 30s
    depends_on:
      collector:
        condition: service_healthy
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    entrypoint: [chess-web]
    command: [run]
    environment:
      # Read-only: Grafana's database role can only select from the dashboard views.
      DATABASE_URL: postgresql://grafana_reader:${GRAFANA_DB_PASSWORD}@db:5432/chess
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8083"
    # Loopback only; the host's Cloudflare Tunnel publishes it (route a hostname to http://127.0.0.1:8083).
    ports:
      - "127.0.0.1:${WEB_PORT_HOST:-8083}:8083"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, chess-web, health]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [backend, outbound]

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run uv run scripts/setup.py first}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/players.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/archive:/var/lib/grafana/archive:ro
    depends_on:
      collector:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    networks: [backend, outbound]

networks:
  backend:
    internal: true
  outbound:

volumes:
  postgres-data:
  grafana-data:
