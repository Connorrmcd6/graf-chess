name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.9.24"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test competition rules and database permissions
        run: uv run --locked pytest --integration -q
      - name: Verify generated dashboards
        run: |
          uv run --locked scripts/build_dashboards.py
          git diff --exit-code -- grafana/dashboards
      - name: Validate Compose configuration
        run: |
          uv run --locked scripts/setup.py
          docker compose config --quiet
      - name: Build container images
        run: docker compose build collector db
